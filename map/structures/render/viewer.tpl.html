<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg: #c9dcef; --ink: #1d232b; --panel: rgba(255,255,255,.86); --line: rgba(0,0,0,.12); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b2430; --ink: #e8edf3; --panel: rgba(20,26,34,.86); --line: rgba(255,255,255,.14); } }
  :root[data-theme="dark"] { --bg: #1b2430; --ink: #e8edf3; --panel: rgba(20,26,34,.86); --line: rgba(255,255,255,.14); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 16px; top: 16px; right: 16px; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(6px); }
  #ui h1 { font-size: 15px; margin: 0 0 4px; }
  #ui p { margin: 0 0 8px; opacity: .8; }
  #ui button { font: inherit; padding: 4px 10px; margin: 0 6px 4px 0; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
  #ui button.on { background: rgba(80,120,200,.25); }
  body.shot #ui { display: none; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui"><h1>__TITLE__</h1><p>__BLURB__ Drag to turn, scroll to zoom, right-drag to move.</p>
<div id="views"></div></div>
<script id="data" type="application/json">__DATA__</script>
<script id="tex" type="application/json">__TEX__</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
const D = JSON.parse(document.getElementById("data").textContent);
const TX = JSON.parse(document.getElementById("tex").textContent);
const q = new URLSearchParams(location.hash.slice(1));
if (q.get("shot")) document.body.classList.add("shot");
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const dusk = q.get("light") === "dusk";
{ // sky gradient
  const c = document.createElement("canvas"); c.width = 2; c.height = 256; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 0, 256);
  if (dusk) { gr.addColorStop(0, "#1c2440"); gr.addColorStop(0.6, "#7a5a6e"); gr.addColorStop(1, "#e6a070"); }
  else { gr.addColorStop(0, "#6f9fd8"); gr.addColorStop(0.7, "#bcd6ee"); gr.addColorStop(1, "#e4eef6"); }
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
const [x0, y0, z0, x1, y1, z1] = D.bounds; const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, size = Math.max(x1 - x0, z1 - z0);
scene.fog = new THREE.Fog(dusk ? 0x6a5a70 : 0xd3e3f1, size * 1.2, size * 3.5);
const hemi = new THREE.HemisphereLight(dusk ? 0x8090c0 : 0xdfeaff, dusk ? 0x403028 : 0x6b5a45, dusk ? 0.55 : 1.15); scene.add(hemi);
const sun = new THREE.DirectionalLight(dusk ? 0xffb070 : 0xfff1dc, dusk ? 1.2 : 2.6);
const sunDir = dusk ? new THREE.Vector3(-0.8, 0.35, 0.5) : new THREE.Vector3(-0.55, 0.85, 0.45);
sun.position.set(cx + sunDir.x * size * 2, y0 + sunDir.y * size * 2, cz + sunDir.z * size * 2); sun.target.position.set(cx, y0, cz);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
const sc = sun.shadow.camera; sc.left = -size; sc.right = size; sc.top = size; sc.bottom = -size; sc.near = 1; sc.far = size * 5;
scene.add(sun, sun.target);
const loader = new THREE.TextureLoader();
for (const [key, m] of Object.entries(D.meshes)) {
  const g = new THREE.BufferGeometry(); const nq = m.c.length / 4;
  g.setAttribute("position", new THREE.Float32BufferAttribute(m.p, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(m.n, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(m.uv, 2));
  const col = new Float32Array(m.c.length * 3); m.c.forEach((a, i) => { col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = a; });
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const idx = []; for (let i = 0; i < nq; i++) { const b = i * 4; idx.push(b, b + 1, b + 2, b, b + 2, b + 3); }
  g.setIndex(idx);
  const t = loader.load(TX[key]); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapLinearFilter; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const mat = new THREE.MeshLambertMaterial({ map: t, vertexColors: true, alphaTest: m.cut ? 0.5 : 0, transparent: !!m.water, opacity: m.water ? 0.82 : 1, side: THREE.FrontSide });
  if (m.glow) { mat.emissive = new THREE.Color(dusk ? 0xffc070 : 0x000000); mat.emissiveMap = t; mat.emissiveIntensity = dusk ? 1.4 : 0; }
  const mesh = new THREE.Mesh(g, mat); mesh.castShadow = !m.water; mesh.receiveShadow = true; scene.add(mesh);
}
if (dusk) { // lantern light
  for (const [key, m] of Object.entries(D.meshes)) if (m.glow) {
    const seen = new Set();
    for (let i = 0; i < m.p.length; i += 12 * 6) { const k = [Math.floor(m.p[i]), Math.floor(m.p[i + 1]), Math.floor(m.p[i + 2])].join(); if (seen.has(k) || seen.size > 24) continue; seen.add(k);
      const L = new THREE.PointLight(0xffb060, 6, 9, 1.6); L.position.set(m.p[i] + 0.3, m.p[i + 1], m.p[i + 2] + 0.3); scene.add(L); }
  }
}
const cam = new THREE.PerspectiveCamera(Number(q.get("fov") || 32), W / H, 0.5, size * 8);
const controls = new OrbitControls(cam, renderer.domElement); controls.enableDamping = true;
const VIEWS = D.camera?.views || { "front-left": [-35, 28, 1.25], "front-right": [35, 28, 1.25], "high": [20, 55, 1.4], "street": [-15, 8, 0.75] };
function view(name) {
  const [az, el, dist, tx, ty_, tz] = VIEWS[name]; const a = az * Math.PI / 180, e = el * Math.PI / 180;
  const r = tx === undefined ? size * (dist || 1.3) * 1.1 : dist;
  const ty = ty_ ?? y0 + (y1 - y0) * 0.32, X = tx ?? cx, Z = tz ?? cz;
  cam.position.set(X + Math.sin(a) * Math.cos(e) * r, ty + Math.sin(e) * r, Z + Math.cos(a) * Math.cos(e) * r);
  controls.target.set(X, ty, Z); controls.update();
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.textContent === name));
}
const vb = document.getElementById("views");
for (const name of Object.keys(VIEWS)) { const b = document.createElement("button"); b.textContent = name; b.onclick = () => view(name); vb.appendChild(b); }
view(q.get("view") || Object.keys(VIEWS)[0]);
addEventListener("resize", () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
let frames = 0;
(function loop() { controls.update(); renderer.render(scene, cam); if (++frames === 30) window.__ready = true; requestAnimationFrame(loop); })();
</script>
</body>
</html>
