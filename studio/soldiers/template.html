<title>Hollow Crown Soldiers</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>

</style>
<div class="wrap">
  <aside>
    <div>
      <h1>The Barracks Muster</h1>

    </div>

const sun = new THREE.DirectionalLight(0xffffff, 0.62); sun.position.set(-30, 60, -50); scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.12 }));

// drag / zoom

  btns($("tiers"), TIER_NAMES.map((n, i) => ({ label: n })), (it, i) => !S.lineup && i === S.tier, (it, i) => { S.tier = i; S.lineup = false; renderAll(); rebuild(); });
  btns($("colors"), DATA.colors.map((c) => ({ label: c.replace("_", " "), color: DYE[c] })), (it, i) => i === S.color, (it, i) => { S.color = i; renderAll(); rebuild(); }, "chip");
  btns($("states"), [["idle", "Standing"], ["walk", "Marching"], ["ready", "Has a target"], ["attack", "Attacking"]].map(([k, label]) => ({ k, label })), (it) => it.k === S.state, (it) => { S.state = it.k; renderAll(); });
  const views = [{ k: "one", label: "One soldier" }, { k: "lineup", label: "All five tiers" }];
  if (S.type === "knight") views.push({ k: "mount", label: S.mounted ? "Dismount" : "On his horse" });
  btns($("views"), views, (it) => (it.k === "lineup") === S.lineup && it.k !== "mount", (it) => {
    if (it.k === "mount") S.mounted = !S.mounted; else S.lineup = it.k === "lineup";
    renderAll(); rebuild();
  });
  const inf = INFO[S.type];
  $("info").innerHTML = `<b>${DATA.types[S.type].name}</b><p>${inf[0]}</p><p>${inf[1]}</p>`;
  $("hint").textContent = `${REGION_NAMES[S.region]} · ${DATA.colors[S.color].replace("_", " ")} banner · ${S.lineup ? "all five armour tiers" : TIER_NAMES[S.tier]}`;
  renderMoves();
}
S.mounted = false;
renderAll(); rebuild(); requestAnimationFrame(tick);
window.addEventListener("resize", render);
</script>
