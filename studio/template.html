<title>Siege Nights Texture Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: asset list on the left, 3D stage in the middle, pixel workbench on the right. Stacks on narrow screens. */
:root {
  --bg: #eceef0; --panel: #f8f9fa; --ink: #1c1f23; --muted: #5b626b; --line: #d2d6db;
  --accent: #9e2a22; --accent-ink: #ffffff; --gold: #a87d14; --ok: #2c7a47; --warn: #b05a14;
  --stage: #d7dbe0; --chip: #e3e6ea; --focus: #2f6fd6;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --panel: #1a1d21; --ink: #e6e8eb; --muted: #9aa2ac; --line: #2c3137;
  --accent: #cf4a3e; --accent-ink: #ffffff; --gold: #d8b03c; --ok: #4fb377; --warn: #e48b3d;
  --stage: #0c0e11; --chip: #252a30; --focus: #6aa0ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121417; --panel: #1a1d21; --ink: #e6e8eb; --muted: #9aa2ac; --line: #2c3137;
  --accent: #cf4a3e; --accent-ink: #ffffff; --gold: #d8b03c; --ok: #4fb377; --warn: #e48b3d;
  --stage: #0c0e11; --chip: #252a30; --focus: #6aa0ff; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); height: 100%; }
/* ---------- list ---------- */
.list { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 17px; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.progress { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .a { background: var(--ok); } .bar .c { background: var(--warn); }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.items { overflow-y: auto; flex: 1; padding: 6px 0 16px; }
.cat { font-family: var(--display); font-size: 11px; color: var(--muted); padding: 12px 16px 4px; letter-spacing: 0.06em; }
.row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 16px; cursor: pointer; }
.row:hover { background: var(--chip); }
.row[aria-current="true"] { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
.row canvas { width: 32px; height: 32px; image-rendering: pixelated; border-radius: 3px; background: var(--stage); }
.row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dot.approved { background: var(--ok); border-color: var(--ok); }
.dot.changes { background: var(--warn); border-color: var(--warn); }
/* ---------- main ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(330px, 1fr); min-height: 0; }
.stagecol { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.head { padding: 16px 20px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
.eyebrow { font-family: var(--display); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; grid-column: 1 / -1; }
.nav { display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.warn { background: transparent; border-color: var(--warn); color: var(--warn); }
.btn.warn[aria-pressed="true"] { background: var(--warn); color: #fff; }
.btn.primary[aria-pressed="true"] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 30%, transparent); }
.stage { position: relative; flex: 1; min-height: 300px; background: var(--stage); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stagebar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 6px; justify-content: space-between; align-items: flex-end; pointer-events: none; flex-wrap: wrap; }
.stagebar > * { pointer-events: auto; }
.stagebar .btn { background: color-mix(in srgb, var(--panel) 88%, transparent); font-size: 12px; padding: 4px 9px; }
.hint { font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 3px 8px; border-radius: 4px; }
.variants { display: flex; gap: 6px; padding: 10px 20px 14px; overflow-x: auto; border-top: 1px solid var(--line); background: var(--panel); }
.variants button { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.variants button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); }
/* ---------- workbench ---------- */
.bench { overflow-y: auto; padding: 16px 20px 24px; display: grid; gap: 18px; align-content: start; background: var(--panel); }
.sect { display: grid; gap: 8px; }
.sect h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); }
.files { display: flex; gap: 6px; flex-wrap: wrap; }
.files button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 8px; font-family: var(--mono); font-size: 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; max-width: 100%; }
.files button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.files .ed { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.canvasbox { display: grid; place-items: center; background: var(--stage); border-radius: 8px; padding: 12px; }
#paint { image-rendering: pixelated; touch-action: none; cursor: crosshair; max-width: 100%; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tools button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tools input[type=color] { width: 38px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
.palette { display: flex; flex-wrap: wrap; gap: 3px; }
.palette button { width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 3px; padding: 0; cursor: pointer; }
.fileinfo { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.sliders { display: grid; grid-template-columns: 82px minmax(0, 1fr) 42px; gap: 6px 10px; align-items: center; font-size: 12px; }
.sliders output { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.sliders input { width: 100%; accent-color: var(--accent); }
.cloth { display: flex; gap: 8px; align-items: center; font-size: 12px; }
textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); }
.review { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.saved { font-size: 12px; color: var(--muted); }
.saved.bad { color: var(--warn); }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.approved { border-color: var(--ok); color: var(--ok); }
.pill.changes { border-color: var(--warn); color: var(--warn); }
@media (max-width: 1100px) {
  .main { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
  .stagecol { border-right: 0; }
  .stage { min-height: 360px; height: 52vh; flex: none; }
}
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .list { border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .items { display: flex; overflow-x: auto; overflow-y: hidden; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 4px; }
  .cat { display: none; }
  .row { grid-template-columns: 32px; padding: 6px; width: auto; position: relative; border-radius: 6px; }
  .row .nm { display: none; }
  .row .dot { position: absolute; right: 2px; top: 2px; }
  .row[aria-current="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
  .head, .variants, .bench { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .head h2 { font-size: 21px; }
  .main { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="list" aria-label="Textures">
    <div class="brand">
      <h1>Texture Studio</h1>
      <div class="progress">
        <div class="bar" aria-hidden="true"><span class="a" id="barA"></span><span class="c" id="barC"></span></div>
        <span id="progressText">Loading textures…</span>
      </div>
      <div class="filters" role="group" aria-label="Show">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="pending" aria-pressed="false">To review</button>
        <button type="button" data-f="changes" aria-pressed="false">Changes</button>
        <button type="button" data-f="approved" aria-pressed="false">Approved</button>
      </div>
    </div>
    <nav class="items" id="items"></nav>
  </aside>

  <div class="main">
    <section class="stagecol">
      <div class="head">
        <div>
          <div class="eyebrow" id="eyebrow">Blocks</div>
          <h2 id="title">Castle Stone</h2>
        </div>
        <div class="nav">
          <button class="btn" type="button" id="prev" aria-label="Previous texture">←</button>
          <span id="counter">1 / 29</span>
          <button class="btn" type="button" id="next" aria-label="Next texture">→</button>
        </div>
        <p id="note"></p>
      </div>
      <div class="stage" id="stage">
        <canvas id="three" aria-label="3D preview, drag to turn it"></canvas>
        <div class="stagebar">
          <span class="hint">Drag to turn · scroll or pinch to zoom</span>
          <span style="display:flex;gap:6px">
            <button class="btn" type="button" id="spin" aria-pressed="true">Spin</button>
            <button class="btn" type="button" id="resetView">Reset view</button>
          </span>
        </div>
      </div>
      <div class="variants" id="variants" role="group" aria-label="Versions"></div>
    </section>

    <section class="bench" aria-label="Edit and review">
      <div class="sect">
        <h3>Textures in this view</h3>
        <div class="files" id="files"></div>
        <div class="fileinfo" id="fileinfo"></div>
      </div>
      <div class="sect">
        <div class="canvasbox"><canvas id="paint" width="16" height="16" aria-label="Pixel editor"></canvas></div>
        <div class="tools" role="group" aria-label="Tools">
          <button class="btn" type="button" data-tool="pencil" aria-pressed="true" title="Pencil (B)">Pencil</button>
          <button class="btn" type="button" data-tool="fill" aria-pressed="false" title="Fill (G)">Fill</button>
          <button class="btn" type="button" data-tool="picker" aria-pressed="false" title="Pick color (I)">Pick</button>
          <button class="btn" type="button" data-tool="eraser" aria-pressed="false" title="Eraser (E)">Erase</button>
          <input type="color" id="color" value="#9e2a22" aria-label="Paint color">
          <button class="btn" type="button" id="undo" title="Undo (Ctrl+Z)">Undo</button>
          <button class="btn" type="button" id="revert">Back to original</button>
        </div>
        <label class="cloth" id="clothRow" hidden><input type="checkbox" id="cloth"> Paint as cloth (takes the banner color in game)</label>
        <div class="palette" id="palette" aria-label="Colors in this texture"></div>
      </div>
      <div class="sect">
        <h3>Adjust the whole texture</h3>
        <div class="sliders">
          <label for="hue">Hue</label><input type="range" id="hue" min="-180" max="180" value="0"><output id="hueOut">0</output>
          <label for="sat">Saturation</label><input type="range" id="sat" min="-100" max="100" value="0"><output id="satOut">0</output>
          <label for="bri">Brightness</label><input type="range" id="bri" min="-100" max="100" value="0"><output id="briOut">0</output>
        </div>
      </div>
      <div class="sect">
        <h3>Your call <span class="pill" id="statusPill">To review</span></h3>
        <textarea id="comment" placeholder="What should change? For example: darker mortar lines, more moss at the bottom, make the cracks bigger."></textarea>
        <div class="review">
          <button class="btn primary" type="button" id="approve" aria-pressed="false">Approve</button>
          <button class="btn warn" type="button" id="changes" aria-pressed="false">Needs changes</button>
          <span class="saved" id="saved"></span>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
const M = JSON.parse(document.getElementById("manifest").textContent);
const $ = (id) => document.getElementById(id);
const groups = M.groups;
const reviews = {}; // group id -> { status, note }
let current = 0, variantIx = 0, filePath = null, filter = "all";

// ---------- Working copies of every texture ----------
const work = {}; // path -> { canvas, ctx, w, h, orig, undo, textures: [], listeners: [] }
const ready = Promise.all(Object.entries(M.textures).map(([path, src]) => new Promise((res) => {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = img.width; canvas.height = img.height;

}

  return false;
}

// Leather-style armor: cloth pixels (from the mask) take the banner color, the rest keep their own color
function tinted(path, tint) {

    const p = d.data;
    for (let i = 0; i < p.length; i += 4) {

}
const isArmor = (path) => !!(M.masks && M.masks[path]);   // leather-style sheets: flat ones and the 3D guard sets

// ---------- 3D ----------
const canvas3d = $("three");
const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 200);
const controls = new THREE.OrbitControls(camera, canvas3d);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(3, 6, 4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshLambertMaterial({ color: 0x888888, transparent: true, opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function applyStageColor() { renderer.setClearColor(new THREE.Color(cssVar("--stage") || "#d7dbe0")); }
applyStageColor();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyStageColor);
new MutationObserver(applyStageColor).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function texFromCanvas(c) {
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  return t;
}
// A material that follows edits to `path` live
function liveMaterial(path, tint, extra) {
  if (!work[path]) return new THREE.MeshLambertMaterial({ color: 0xff00ff });

  if (isArmor(path)) { const t = tinted(path, tint); tex = texFromCanvas(t.canvas); redraw = t.redraw; }

}

const D = THREE.MathUtils.degToRad;
// Faces: corners TL, TR, BL, BR as seen from outside (Blockbench convention, X mirrored from Bedrock)
function faceCorners(f, x1, y1, z1, x2, y2, z2) {
  switch (f) {
    case "north": return [[x2, y2, z1], [x1, y2, z1], [x2, y1, z1], [x1, y1, z1]];
    case "south": return [[x1, y2, z2], [x2, y2, z2], [x1, y1, z2], [x2, y1, z2]];
    case "east": return [[x2, y2, z2], [x2, y2, z1], [x2, y1, z2], [x2, y1, z1]];
    case "west": return [[x1, y2, z1], [x1, y2, z2], [x1, y1, z1], [x1, y1, z2]];
    case "up": return [[x1, y2, z1], [x2, y2, z1], [x1, y2, z2], [x2, y2, z2]];
    case "down": return [[x1, y1, z2], [x2, y1, z2], [x1, y1, z1], [x2, y1, z1]];

const FACES = ["north", "south", "east", "west", "up", "down"];
function boxUV(c) {

    east: [u, v + d, u + d, v + d + h], north: [u + d, v + d, u + d + w, v + d + h],
    west: [u + d + w, v + d, u + 2 * d + w, v + d + h], south: [u + 2 * d + w, v + d, u + 2 * d + 2 * w, v + d + h],
    up: [u + d, v, u + d + w, v + d], down: [u + d + w, v + d, u + d + 2 * w, v],

}

  const out = {};

    const fu = c.uv[f]; if (!fu) continue;
    const [u, v] = fu.uv, [w, h] = fu.uv_size;
    let rect = [u, v, u + w, v + h];

  }

}
function buildCube(c, tw, th, getMat) {

  if (r.status === "approved") setTimeout(() => goNextPending(), 450);
}
$("approve").onclick = () => setStatus("approved");
$("changes").onclick = () => setStatus("changes");

function loadPng(path, png, mask) {
  return new Promise((res) => { const img = new Image(); img.onload = () => { const w = work[path]; w.ctx.clearRect(0, 0, w.w, w.h); w.ctx.drawImage(img, 0, 0); if (w.mask && mask) w.mask = Uint8Array.from(mask, (ch) => ch === "1" ? 1 : 0); w.savedPng = png; changed(path); res(); }; img.onerror = res; img.src = png; });
}
async function connect() {
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { setSaved("Saving isn't available here, so changes only last until you close this page.", true); return; }
  db.collection("reviews").onSnapshot((snap) => {
    for (const d of snap.docs) { const x = d.data() || {}; if (d.id === groups[current].id && document.activeElement === $("comment")) { reviews[d.id] = { ...reviews[d.id], status: x.status }; continue; } reviews[d.id] = { status: x.status, note: x.note }; }
    renderList(); renderReview();
  }, () => setSaved("Couldn't load saved reviews.", true));
  db.collection("edits").onSnapshot(async (snap) => {
    const seen = new Set();
    for (const d of snap.docs) {
      const x = d.data() || {}; if (!x.path || !work[x.path]) continue; seen.add(x.path);
      if (pending.has(x.path) || work[x.path].savedPng === x.png) continue;
      await loadPng(x.path, x.png, x.clothMask);
    }
    for (const [path, w] of Object.entries(work)) {
      if (w.savedPng && !seen.has(path) && !pending.has(path)) { w.ctx.putImageData(w.orig, 0, 0); if (w.mask) w.mask = w.origMask.slice(); w.savedPng = null; changed(path); }
    }
    if (filePath) { drawEditor(); drawPalette(); renderFiles(); }
    updateThumbs();
  }, () => setSaved("Couldn't load saved edits.", true));
}

// ---------- Rendering the page ----------
const status = (g) => reviews[g.id]?.status || "pending";
const thumbs = [];
function renderList() {
  const nav = $("items"); nav.textContent = ""; thumbs.length = 0;
  let cat = null;
  groups.forEach((g, i) => {
    if (filter !== "all" && status(g) !== filter) return;
    if (g.cat !== cat) { cat = g.cat; const h = document.createElement("div"); h.className = "cat"; h.textContent = cat.toUpperCase(); nav.appendChild(h); }
    const b = document.createElement("button"); b.type = "button"; b.className = "row"; b.setAttribute("aria-current", i === current);
    const c = document.createElement("canvas"); c.width = 32; c.height = 32;
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = g.name;
    const dot = document.createElement("span"); dot.className = "dot " + status(g); dot.title = { pending: "To review", approved: "Approved", changes: "Needs changes" }[status(g)];
    b.append(c, nm, dot); b.onclick = () => select(i); b.title = g.name;
    nav.appendChild(b); thumbs.push([c, g]);
  });
  updateThumbs();
  const a = groups.filter((g) => status(g) === "approved").length, ch = groups.filter((g) => status(g) === "changes").length;
  $("barA").style.width = (a / groups.length * 100) + "%"; $("barC").style.width = (ch / groups.length * 100) + "%";
  $("progressText").textContent = `${a} of ${groups.length} approved${ch ? ` · ${ch} need changes` : ""}`;
}
function updateThumbs() {
  for (const [c, g] of thumbs) {
    const ctx = c.getContext("2d"); ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, 32, 32);
    const v = g.variants[0]; const path = v.mats["*"] || v.mats.cloth || v.mats.layer1;
    const w = work[path]; if (!w) continue;
    const s = Math.min(w.w, w.h, g.id === "pack_icon" ? 256 : 16);
    if (isArmor(path)) ctx.drawImage(tinted(path, v.tint).canvas, 16, 16, 8, 8, 0, 0, 32, 32);
    else if (v.model === "entity" || v.model === "horse") ctx.drawImage(w.canvas, 8, 8, 8, 8, 0, 0, 32, 32);
    else ctx.drawImage(w.canvas, 0, 0, s, s, 0, 0, 32, 32);
  }
}
function renderVariants() {
  const g = groups[current], el = $("variants"); el.textContent = "";
  el.hidden = g.variants.length < 2;
  g.variants.forEach((v, i) => {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-pressed", i === variantIx);
    if (v.swatch) { const s = document.createElement("span"); s.className = "sw"; s.style.background = `rgb(${v.swatch.join(",")})`; b.appendChild(s); }
    b.append(v.label); b.onclick = () => { variantIx = i; renderVariants(); showVariant(); pickFile(); };
    el.appendChild(b);
  });
}
function renderFiles() {
  const v = groups[current].variants[variantIx], el = $("files"); el.textContent = "";
  for (const path of filesOf(v)) {
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-pressed", path === filePath);
    b.textContent = path.split("/").pop().replace(".png", "");
    if (isEdited(path)) { const s = document.createElement("span"); s.className = "ed"; s.title = "Edited"; b.prepend(s); }
    b.onclick = () => { filePath = path; endAdjust(); renderFiles(); openFile(); };
    el.appendChild(b);
  }
}
function openFile() {
  const w = work[filePath];
  $("fileinfo").textContent = `Siege_Nights_RP/${filePath} · ${w.w}×${w.h}${isEdited(filePath) ? " · edited" : ""}`;
  $("clothRow").hidden = !isArmor(filePath);
  drawEditor(); drawPalette();
}
function pickFile() {
  const files = filesOf(groups[current].variants[variantIx]);
  if (!files.includes(filePath)) filePath = files.find((p) => !p.includes("bottom")) || files[0];
  renderFiles(); openFile();
}
function renderReview() {
  const g = groups[current], r = reviews[g.id] || {}, s = r.status || "pending";
  $("approve").setAttribute("aria-pressed", s === "approved"); $("changes").setAttribute("aria-pressed", s === "changes");
  const pill = $("statusPill"); pill.className = "pill " + s; pill.textContent = { pending: "To review", approved: "Approved", changes: "Needs changes" }[s];
  if (document.activeElement !== $("comment")) $("comment").value = r.note || "";
}
function select(i) {
  current = (i + groups.length) % groups.length; variantIx = 0; filePath = null; endAdjust();
  const g = groups[current];
  $("eyebrow").textContent = g.cat.toUpperCase(); $("title").textContent = g.name;
  $("note").textContent = g.note || ""; $("note").hidden = !g.note;
  $("counter").textContent = `${current + 1} / ${groups.length}`;
  renderList(); renderVariants(); showVariant(); pickFile(); renderReview();
  try { localStorage.setItem("siegeStudio.current", g.id); } catch {}
}
function goNextPending() {
  for (let k = 1; k <= groups.length; k++) { const i = (current + k) % groups.length; if (status(groups[i]) === "pending") return select(i); }
}
$("prev").onclick = () => select(current - 1);
$("next").onclick = () => select(current + 1);
document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll("[data-f]").forEach((x) => x.setAttribute("aria-pressed", x === b)); renderList();
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("textarea, input")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); return undo(); }
  if (e.key === "ArrowRight") select(current + 1);
  else if (e.key === "ArrowLeft") select(current - 1);
  else if (e.key === "b") setTool("pencil"); else if (e.key === "e") setTool("eraser");
  else if (e.key === "i") setTool("picker"); else if (e.key === "g") setTool("fill");
});
new ResizeObserver(() => filePath && drawEditor()).observe(paint.parentElement);

ready.then(() => {
  let start = 0;
  try { const id = localStorage.getItem("siegeStudio.current"); const i = groups.findIndex((g) => g.id === id); if (i >= 0) start = i; } catch {}
  resize(); select(start); connect();
});
})();
</script>
