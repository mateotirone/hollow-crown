<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Crown Assets</title>
<style>
:root{--bg:#141119;--panel:#1d1924;--line:#2e2838;--text:#e4dcef;--dim:#9a90a8;--accent:#b68cff;--warn:#ffb86b;--ok:#7fd99a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--dim);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:#2c2537;color:var(--text)}
nav button .n{color:var(--dim);font-size:12px;margin-left:4px}
#status{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12px;flex-wrap:wrap}
#status select,#status button{background:#2a2433;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.busy{background:var(--warn);animation:p 1s infinite alternate}.dot.err{background:#ff6b6b}
@keyframes p{to{opacity:.3}}
main{position:absolute;top:var(--top,46px);left:0;right:0;bottom:0;display:flex}
#side{width:300px;min-width:220px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#side input{margin:8px;padding:6px 8px;background:#120f17;border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit}
#list{overflow:auto;flex:1;padding-bottom:20px}
#list h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:12px 12px 4px;font-weight:600}
#list .it{padding:5px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#list .it:hover{background:#262030}#list .it.on{background:#3a2f4d}
#list .it small{color:var(--dim);font-size:11px;white-space:nowrap}
.wip{color:var(--warn)!important}
#stage{flex:1;position:relative;min-width:0}
#stage canvas{display:block;width:100%;height:100%}
#info{position:absolute;left:12px;top:10px;right:12px;pointer-events:none}
#info h2{margin:0;font-size:18px}#info p{margin:2px 0;color:var(--dim);font-size:12px}
#controls{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
#controls label{background:#1d1924cc;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--dim)}
#controls select{background:#2a2433;color:var(--text);border:1px solid var(--line);border-radius:4px;font:inherit;max-width:240px}
#grid{position:absolute;inset:0;overflow:auto;padding:12px;display:none}
#grid h3{font-size:12px;color:var(--dim);margin:14px 0 6px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:11px;color:var(--dim);overflow:hidden;cursor:pointer}
.tile img{width:64px;height:64px;image-rendering:pixelated;object-fit:contain;display:block;margin:0 auto 4px;background:repeating-conic-gradient(#221d29 0 25%,#1a1620 0 50%) 0 0/12px 12px}
.tile span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#big{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:5;cursor:zoom-out}
#big img{max-width:90vw;max-height:80vh;min-width:256px;image-rendering:pixelated;background:repeating-conic-gradient(#221d29 0 25%,#1a1620 0 50%) 0 0/16px 16px}
#big p{color:var(--text);text-align:center}
iframe{border:0;width:100%;height:100%;display:none;background:#16131c}
#msg{position:absolute;inset:0;display:none;place-items:center;color:var(--dim);text-align:center;padding:30px}
@media (max-width:700px){#side{width:42%;min-width:0}}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head>
<body>
<header>
  <h1>The Hollow Crown · assets</h1>
  <nav id="tabs"></nav>
  <div id="status">
    <span><span id="dot" class="dot busy"></span> <span id="stext">Starting</span></span>
    <select id="mode" title="What to show">
      <option value="all">Main + work in progress</option>
      <option value="main">Only what is merged</option>
    </select>
    <button id="now" title="Check GitHub for new pushes now">Check now</button>
  </div>
</header>
<main>
  <div id="side"><input id="q" placeholder="Search" autocomplete="off"><div id="list"></div></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="info"></div>
    <div id="controls"></div>
    <div id="grid"></div>
    <iframe id="builds" title="Builds"></iframe>
    <div id="msg"></div>
  </div>
</main>
<div id="big"><div><img id="bigimg" alt=""><p id="bigp"></p></div></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const TABS = [
  ["builds", "Builds"], ["mobs", "Mobs & NPCs"], ["armour", "Armour & worn"], ["blocks", "Blocks"], ["items", "Item icons"], ["textures", "All textures"],
];
let tab = localStorageGet("tab") || "builds", data = null, state = null, selected = {}, query = "";
function localStorageGet(k) { try { return localStorage.getItem("av." + k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem("av." + k, v); } catch { /* private window */ } }
document.documentElement.style.setProperty("--top", document.querySelector("header").offsetHeight + "px");
addEventListener("resize", () => document.documentElement.style.setProperty("--top", document.querySelector("header").offsetHeight + "px"));

// ------------------------------------------------------------ three.js stage
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1620);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 5000);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x554466, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-30, 60, -40); scene.add(sun);
const grid = new THREE.GridHelper(64, 64, 0x3a3346, 0x262130); scene.add(grid);
let model = null;
function resize() { const r = $("stage").getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe($("stage"));
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

const texCache = new Map();
const loader = new THREE.TextureLoader();
function tex(url) {
  if (!url) return null;
  if (!texCache.has(url)) {
    const t = loader.load(url + (url.includes("?") ? "&" : "?") + "v=" + (data?.version ?? 0));
    t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false;
    texCache.set(url, t);
  }
  return texCache.get(url);
}
const grey = new THREE.MeshLambertMaterial({ color: 0x77708a });
const mannequin = new THREE.MeshLambertMaterial({ color: 0x4a4458, transparent: true, opacity: 0.55 });
const matFor = (url) => {
  const t = tex(url);
  return t ? new THREE.MeshLambertMaterial({ map: t, transparent: true, alphaTest: 0.02, side: THREE.DoubleSide }) : grey;
};

// Bedrock geometry -> three.js, in Blockbench's space (x mirrored), 16 units = 1 block.
const D2R = Math.PI / 180;
const euler = (r) => new THREE.Euler(-(r?.[0] || 0) * D2R, -(r?.[1] || 0) * D2R, (r?.[2] || 0) * D2R, "ZYX");
function faceRects(c, tw, th) {
  const [w, h, d] = c.size.map((v) => Math.floor(v + 0.0001));
  const R = {};
  if (Array.isArray(c.uv) || !c.uv) {
    const [u, v] = c.uv || [0, 0];
    R.north = [u + d, v + d, w, h]; R.east = [u, v + d, d, h]; R.south = [u + 2 * d + w, v + d, w, h]; R.west = [u + d + w, v + d, d, h];
    R.up = [u + d, v, w, d]; R.down = [u + d + w, v, w, d];
    if (c.mirror) { [R.east, R.west] = [R.west, R.east]; for (const k in R) R[k] = [R[k][0] + R[k][2], R[k][1], -R[k][2], R[k][3]]; }
  } else {
    for (const [k, f] of Object.entries(c.uv)) if (f && f.uv) R[k] = [f.uv[0], f.uv[1], (f.uv_size || [0, 0])[0], (f.uv_size || [0, 0])[1]];
  }
  return R;
}
function boxGeometry(min, max, rects, tw, th) {
  const [x0, y0, z0] = min, [x1, y1, z1] = max;
  // corners per face: top-left, top-right, bottom-left, bottom-right as seen from outside
  const F = {
    north: [[x1, y1, z0], [x0, y1, z0], [x1, y0, z0], [x0, y0, z0], [0, 0, -1]],
    south: [[x0, y1, z1], [x1, y1, z1], [x0, y0, z1], [x1, y0, z1], [0, 0, 1]],
    east: [[x1, y1, z1], [x1, y1, z0], [x1, y0, z1], [x1, y0, z0], [1, 0, 0]],
    west: [[x0, y1, z0], [x0, y1, z1], [x0, y0, z0], [x0, y0, z1], [-1, 0, 0]],
    up: [[x1, y1, z1], [x0, y1, z1], [x1, y1, z0], [x0, y1, z0], [0, 1, 0]],
    down: [[x1, y0, z0], [x0, y0, z0], [x1, y0, z1], [x0, y0, z1], [0, -1, 0]],
  };
  const pos = [], nor = [], uv = [], idx = [];
  for (const [k, [tl, tr, bl, br, n]] of Object.entries(F)) {
    const r = rects[k]; if (!r || (r[2] === 0 && r[3] === 0)) continue;
    const [u, v, w, h] = r, i = pos.length / 3;
    pos.push(...tl, ...tr, ...bl, ...br);
    for (let j = 0; j < 4; j++) nor.push(...n);
    uv.push(u / tw, 1 - v / th, (u + w) / tw, 1 - v / th, u / tw, 1 - (v + h) / th, (u + w) / tw, 1 - (v + h) / th);
    idx.push(i, i + 2, i + 1, i + 1, i + 2, i + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); return g;
}
function buildGeo(geo, material, keepBone) {
  const root = new THREE.Group(), groups = {}, piv = {};
  const tw = geo.tw || 64, th = geo.th || 64;
  for (const b of geo.bones) {
    const g = new THREE.Group(); g.name = b.name || "";
    const p = b.pivot || [0, 0, 0]; piv[b.name] = [-p[0], p[1], p[2]];
    groups[b.name] = g;
  }
  for (const b of geo.bones) {
    const g = groups[b.name], P = piv[b.name];
    const parent = b.parent && groups[b.parent] ? b.parent : null;
    const pp = parent ? piv[parent] : [0, 0, 0];
    g.position.set(P[0] - pp[0], P[1] - pp[1], P[2] - pp[2]);
    g.rotation.copy(euler(b.rotation));
    (parent ? groups[parent] : root).add(g);
    const show = !keepBone || keepBone(b.name, b);
    if (b.neverRender || !show) continue;
    for (const c of b.cubes || []) {
      if (!c.size) continue;
      const inf = c.inflate ?? b.inflate ?? 0;
      const o = c.origin || [0, 0, 0], s = c.size;
      const min = [-(o[0] + s[0]) - inf, o[1] - inf, o[2] - inf], max = [-o[0] + inf, o[1] + s[1] + inf, o[2] + s[2] + inf];
      const mirror = c.mirror ?? b.mirror;
      const geom = boxGeometry(min, max, faceRects({ ...c, mirror }, tw, th), tw, th);
      const mesh = new THREE.Mesh(geom, material);
      if (c.rotation) {
        const cp = c.pivot || [0, 0, 0], C = [-cp[0], cp[1], cp[2]];
        const holder = new THREE.Group(); holder.position.set(C[0] - P[0], C[1] - P[1], C[2] - P[2]); holder.rotation.copy(euler(c.rotation));
        mesh.position.set(-C[0], -C[1], -C[2]); holder.add(mesh); g.add(holder);
      } else { mesh.position.set(-P[0], -P[1], -P[2]); g.add(mesh); }
    }
  }
  return root;
}
const ARMOUR_BONES = { helmet: ["head", "hat", "helmet"], chestplate: ["body", "rightarm", "leftarm", "chestplate"], leggings: ["body", "waist", "rightleg", "leftleg", "leggings"], boots: ["rightleg", "leftleg", "rightboot", "leftboot", "boots"] };
const armourFilter = (geoId, slot) => !slot || !/geometry\.(humanoid|player)\.armor/.test(geoId) ? null
  : (name) => ARMOUR_BONES[slot].includes(String(name).toLowerCase().replace(/_/g, ""));

function show(obj, keepView) {
  if (model) { scene.remove(model); model.traverse((o) => o.geometry?.dispose()); }
  model = obj; scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  grid.position.y = box.min.y;
  const r = Math.max(size.x, size.y, size.z, 8);
  grid.scale.setScalar(Math.max(1, r / 32));
  if (keepView) return;
  controls.target.copy(centre);
  camera.position.copy(centre).add(new THREE.Vector3(r * 0.9, r * 0.55, -r * 1.5));
  camera.near = r / 200; camera.far = r * 50; camera.updateProjectionMatrix();
}

// ------------------------------------------------------------ data and live updates
const branchInfo = (ref) => {
  if (!ref || ref === "origin/main") return "main";
  if (ref === "vanilla") return "vanilla Minecraft";
  const b = state?.branches.find((x) => x.ref === ref);
  return `<span class="wip">in progress</span> on ${ref.replace("origin/", "")}${b ? ": " + esc(b.subject) : ""}`;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
async function loadModels() {
  const r = await fetch("/api/models");
  if (!r.ok) { setTimeout(loadModels, 1500); return; }
  data = await r.json(); texCache.clear();
  render(true);
}
const es = new EventSource("/events");
let modelsVersion = null;
es.addEventListener("models", (e) => { const v = JSON.parse(e.data).version; if (v !== modelsVersion) { modelsVersion = v; loadModels(); } });
es.addEventListener("state", (e) => { state = JSON.parse(e.data); paintStatus(); });
es.addEventListener("builds", (e) => { const d = JSON.parse(e.data); buildsCount = d.count; paintTabs(); if (tab === "builds" && d.count && $("builds").dataset.loaded !== "1") openBuilds(); });
es.onerror = () => { $("dot").className = "dot err"; $("stext").textContent = "Viewer stopped. Start it again and this page reconnects."; };
let buildsCount = 0;

function paintStatus() {
  $("mode").value = state.mode;
  const wip = state.branches.length - 1;
  const busy = state.deps.message || state.builds.status === "building";
  $("dot").className = "dot" + (state.fetchError ? " err" : busy ? " busy" : "");
  const when = state.lastFetch ? new Date(state.lastFetch).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "never";
  const parts = [];
  if (state.fetchError) parts.push("GitHub: " + state.fetchError);
  else parts.push(`Checked GitHub ${when}` + (state.mode === "all" ? ` · ${wip} branch${wip === 1 ? "" : "es"} in progress` : ""));
  if (state.deps.message) parts.push(state.deps.message);
  else if (state.builds.status === "building") parts.push(state.builds.message);
  else if (state.builds.message) parts.push(state.builds.message);
  $("stext").textContent = parts.join(" · ");
}
$("mode").onchange = () => fetch("/api/mode?m=" + $("mode").value, { method: "POST" });
$("now").onclick = () => { fetch("/api/refresh", { method: "POST" }); $("dot").className = "dot busy"; };
$("q").oninput = () => { query = $("q").value.toLowerCase(); render(false); };
$("big").onclick = () => { $("big").style.display = "none"; };

// ------------------------------------------------------------ tabs
function counts() {
  if (!data) return {};
  const sets = new Set(data.attachables.map((a) => a.set));
  return { builds: buildsCount, mobs: data.entities.length, armour: sets.size, blocks: data.blocks.length, items: data.items.length, textures: data.textures.length };
}
function paintTabs() {
  const n = counts();
  $("tabs").innerHTML = TABS.map(([k, t]) => `<button data-k="${k}" class="${k === tab ? "on" : ""}">${t}${n[k] ? `<span class="n">${n[k]}</span>` : ""}</button>`).join("");
  for (const b of $("tabs").children) b.onclick = () => { tab = b.dataset.k; localStorageSet("tab", tab); render(false); };
}
function openBuilds() { const f = $("builds"); f.src = "/builds/"; f.dataset.loaded = "1"; }

function render(fresh) {
  paintTabs();
  const isBuilds = tab === "builds", isGrid = tab === "items" || tab === "textures";
  $("builds").style.display = isBuilds ? "block" : "none";
  $("side").style.display = isBuilds || isGrid ? "none" : "flex";
  $("grid").style.display = isGrid ? "block" : "none";
  canvas.style.display = $("info").style.display = $("controls").style.display = isBuilds || isGrid ? "none" : "";
  $("msg").style.display = "none";
  if (isBuilds) { if ($("builds").dataset.loaded !== "1") openBuilds(); return; }
  if (!data) { $("msg").style.display = "grid"; $("msg").textContent = "Reading the packs from git"; return; }
  if (isGrid) return paintGrid();
  paintList(fresh);
  resize();
}

function entries() {
  if (tab === "mobs") return data.entities.map((e) => ({ key: e.id, title: e.name, group: e.group, sub: e.id, e }));
  if (tab === "blocks") return data.blocks.map((b) => ({ key: b.id, title: b.name, group: b.group || "blocks", sub: b.id, b }));
  if (tab === "armour") {
    const sets = new Map();
    for (const a of data.attachables) { const s = sets.get(a.set) || { key: a.set, title: a.slot ? a.setName : a.name, group: a.group || (a.slot ? "armour" : "held and worn items"), parts: [] }; s.parts.push(a); sets.set(a.set, s); }
    return [...sets.values()].map((s) => ({ ...s, sub: s.parts.map((p) => p.slot || "worn").join(", ") }));
  }
  return [];
}

function paintList(fresh) {
  const all = entries().filter((x) => !query || (x.title + " " + x.sub + " " + x.group).toLowerCase().includes(query));
  const groups = new Map();
  for (const x of all) { if (!groups.has(x.group)) groups.set(x.group, []); groups.get(x.group).push(x); }
  let html = "";
  for (const [g, xs] of [...groups].sort((a, b) => a[0].localeCompare(b[0]))) {
    html += `<h3>${esc(g)}</h3>` + xs.sort((a, b) => a.title.localeCompare(b.title)).map((x) => {
      const ref = x.e?.ref || x.b?.ref || x.parts?.[0]?.ref;
      return `<div class="it ${selected[tab] === x.key ? "on" : ""}" data-k="${esc(x.key)}"><span>${esc(x.title)}</span>${ref && ref !== "origin/main" ? '<small class="wip">new</small>' : ""}</div>`;
    }).join("");
  }
  $("list").innerHTML = html || `<p style="padding:12px;color:var(--dim)">Nothing here${query ? " matches" : " yet"}.</p>`;
  for (const el of $("list").querySelectorAll(".it")) el.onclick = () => { selected[tab] = el.dataset.k; localStorageSet("sel." + tab, el.dataset.k); paintList(false); draw(false); };
  if (!selected[tab]) selected[tab] = localStorageGet("sel." + tab) || all[0]?.key;
  draw(fresh);         // a live refresh keeps the camera where it is
}

const choice = {};
function control(label, key, options, onchange) {
  if (options.length < 2) return "";
  if (!options.some((o) => o.v === choice[key])) choice[key] = options[0].v;
  return `<label>${label} <select data-c="${key}">${options.map((o) => `<option value="${esc(o.v)}"${o.v === choice[key] ? " selected" : ""}>${esc(o.t)}</option>`).join("")}</select></label>`;
}
function wireControls() { for (const s of $("controls").querySelectorAll("select")) s.onchange = () => { choice[s.dataset.c] = s.value; draw(true); }; }
const geoOf = (id) => data.geometry[id];

function draw(keepView) {
  const x = entries().find((e) => e.key === selected[tab]);
  if (!x) { $("info").innerHTML = ""; $("controls").innerHTML = ""; if (model) scene.remove(model); return; }
  const notes = [];
  if (x.e) {
    const e = x.e, k = "m:" + e.id;
    $("controls").innerHTML = control("Look", k + ":t", e.textures.map((t) => ({ v: t.key, t: t.key + (t.url ? "" : " (vanilla, not shown)") })))
      + control("Shape", k + ":g", e.geometry.map((g) => ({ v: g.key, t: g.key + " · " + g.id })));
    wireControls();
    const t = e.textures.find((t) => t.key === choice[k + ":t"]) || e.textures[0];
    const g = e.geometry.find((g) => g.key === choice[k + ":g"]) || e.geometry[0];
    const geo = g && geoOf(g.id);
    if (!geo) notes.push(g ? `Shape ${g.id} not found` : "No shape");
    if (t && !t.url) notes.push(`Texture ${t.path} is vanilla Minecraft, shown grey`);
    show(geo ? buildGeo(geo, matFor(t?.url)) : new THREE.Group(), keepView);
    $("info").innerHTML = `<h2>${esc(e.name)}</h2><p>${esc(e.id)} · ${branchInfo(e.ref)}</p>${g ? `<p>${esc(g.id)}${geo ? " · from " + (geo.from === "vanilla" ? "vanilla" : branchInfo(geo.from)) : ""}</p>` : ""}${notes.map((n) => `<p>${esc(n)}</p>`).join("")}`;
  } else if (x.parts) {
    const k = "a:" + x.key;
    // Held items (swords, tools) are bound to the hand bone in game and posed by animations; drawn on the
    // mannequin without those they land at its feet, so they are shown on their own, upright.
    const held = x.parts.every((p) => !p.slot || (geoOf(p.geometry[0]?.id)?.bones || []).some((b) => b.binding));
    $("controls").innerHTML = held ? "" : control("Body", k + ":body", [{ v: "on", t: "Mannequin" }, { v: "off", t: "Armour only" }]);
    wireControls();
    const root = new THREE.Group();
    const body = geoOf("geometry.humanoid.custom");
    if (body && !held && choice[k + ":body"] !== "off") root.add(buildGeo(body, mannequin, (n) => !/hat|jacket|sleeve|pants|cape|elytra/i.test(n)));
    const lines = [];
    for (const p of x.parts) {
      const t = p.textures.find((t) => t.key === "enchanted" ? false : true) || p.textures[0];
      const g = p.geometry[0], geo = g && geoOf(g.id);
      if (!geo) { notes.push(`${p.name}: shape ${g?.id || "?"} not found`); continue; }
      if (t && !t.url) notes.push(`${p.name}: texture ${t.path} not found`);
      root.add(buildGeo(geo, matFor(t?.url), armourFilter(g.id, p.slot)));
      lines.push(`${esc(p.name)} · ${esc(g.id)} · ${branchInfo(p.ref)}`);
    }
    show(root, keepView);
    $("info").innerHTML = `<h2>${esc(x.title)}</h2>${lines.map((l) => `<p>${l}</p>`).join("")}${notes.map((n) => `<p>${esc(n)}</p>`).join("")}`;
  } else if (x.b) {
    const b = x.b, faces = b.faces, star = faces["*"] || Object.values(faces)[0];
    let obj;
    const geo = b.geometry && geoOf(b.geometry);
    if (geo) obj = buildGeo(geo, matFor(star?.url));
    else {
      const m = (f) => matFor((faces[f] || star)?.url);
      // three's box face order: +x, -x, +y, -y, +z, -z
      obj = new THREE.Mesh(new THREE.BoxGeometry(16, 16, 16), [m("east"), m("west"), m("up"), m("down"), m("south"), m("north")]);
      obj.position.y = 8;
      if (b.geometry) notes.push(`Shape ${b.geometry} not found, drawn as a cube`);
    }
    show(obj, keepView);
    const missing = Object.values(faces).filter((f) => !f.url).map((f) => f.name);
    if (missing.length) notes.push("Missing textures: " + missing.join(", "));
    $("info").innerHTML = `<h2>${esc(b.name)}</h2><p>${esc(b.id)} · ${branchInfo(b.ref)}</p>${notes.map((n) => `<p>${esc(n)}</p>`).join("")}`;
    $("controls").innerHTML = "";
  }
}

function paintGrid() {
  const list = tab === "items" ? data.items.map((i) => ({ name: i.name, url: i.url, ref: i.ref, folder: "item icons", path: i.missing })) :
    data.textures.map((t) => ({ name: t.path.split("/").pop().replace(/\.(png|tga)$/i, ""), url: t.url, ref: t.ref, folder: t.path.split("/").slice(0, -1).join("/"), path: t.path }));
  const shown = list.filter((x) => !query || (x.name + " " + x.folder).toLowerCase().includes(query));
  const folders = new Map();
  for (const x of shown) { if (!folders.has(x.folder)) folders.set(x.folder, []); folders.get(x.folder).push(x); }
  let html = `<input id="gq" placeholder="Search" value="${esc(query)}" style="padding:6px 8px;background:#120f17;border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;width:260px">`;
  for (const [f, xs] of [...folders].sort((a, b) => a[0].localeCompare(b[0]))) {
    html += `<h3>${esc(f)} · ${xs.length}</h3><div class="tiles">` + xs.map((x) =>
      `<div class="tile" data-u="${esc(x.url || "")}" data-n="${esc(x.name)}" data-r="${esc(x.ref || "")}">${x.url ? `<img loading="lazy" src="${esc(x.url)}?v=${data.version}" alt="">` : "<img alt=''>"}<span class="${x.ref && x.ref !== "origin/main" ? "wip" : ""}">${esc(x.name)}</span></div>`).join("") + "</div>";
  }
  $("grid").innerHTML = html;
  const gq = $("gq"); gq.oninput = () => { query = gq.value.toLowerCase(); $("q").value = gq.value; paintGrid(); const n = $("gq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  for (const t of $("grid").querySelectorAll(".tile")) t.onclick = () => {
    if (!t.dataset.u) return;
    $("bigimg").src = t.dataset.u + "?v=" + data.version; $("bigp").innerHTML = esc(t.dataset.n) + " · " + branchInfo(t.dataset.r); $("big").style.display = "grid";
  };
}

for (const k of ["mobs", "armour", "blocks"]) selected[k] = localStorageGet("sel." + k);
render(false);
</script>
</body>
</html>
