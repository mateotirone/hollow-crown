<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Crown Assets</title>
<style>
:root{--bg:#141119;--panel:#1d1924;--line:#2e2838;--text:#e4dcef;--dim:#9a90a8;--accent:#b68cff;--warn:#ffb86b;--ok:#7fd99a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--dim);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:#2c2537;color:var(--text)}
nav button .n{color:var(--dim);font-size:12px;margin-left:4px}
#status{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12px;flex-wrap:wrap}
#status select,#status button{background:#2a2433;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.busy{background:var(--warn);animation:p 1s infinite alternate}.dot.err{background:#ff6b6b}
@keyframes p{to{opacity:.3}}
main{position:absolute;top:var(--top,46px);left:0;right:0;bottom:0;display:flex}
#side{width:300px;min-width:220px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#sidetop{padding:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#q{padding:7px 9px;background:#120f17;border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;width:100%}
#q:focus{outline:none;border-color:var(--accent)}
#sidetop .row{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim)}
#sidetop label{display:flex;gap:5px;align-items:center;cursor:pointer}
#sidetop button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 8px;font:inherit;cursor:pointer}
#sidetop button:hover{color:var(--text)}
#list{overflow:auto;flex:1;padding-bottom:20px}
#list .sh{all:unset;box-sizing:border-box;width:100%;display:flex;gap:6px;align-items:baseline;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px;border-top:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
#list .sh:hover{background:#262030}
#list .sh .car{display:inline-block;width:10px;color:var(--dim);transition:transform .12s}
#list .sec.open .sh .car{transform:rotate(90deg)}
#list .sh .n{margin-left:auto;color:var(--dim);font-weight:400;font-size:12px}
#list .sh small{font-weight:400}
#list h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:10px 12px 3px 26px;font-weight:600}
#list .it{padding:4px 12px 4px 26px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#list .it:hover{background:#262030}#list .it.on{background:#3a2f4d}
#list .it small{color:var(--dim);font-size:11px;white-space:nowrap}
#list .chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 6px 26px}
#list .chips button{background:#26202f;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:1px 8px;font:inherit;font-size:11px;cursor:pointer}
#list .chips button:hover{color:var(--text)}#list .chips button.on{background:#3a2f4d;color:var(--text);border-color:var(--accent)}
#list .none{padding:12px;color:var(--dim)}
mark{background:none;color:var(--accent);font-weight:600}
nav button .n.hit{color:var(--accent)}nav button .n.zero{opacity:.45}
.wip{color:var(--warn)!important}
#stage{flex:1;position:relative;min-width:0}
#stage canvas{display:block;width:100%;height:100%}
#info{position:absolute;left:12px;top:10px;right:12px;pointer-events:none}
#info h2{margin:0;font-size:18px}#info p{margin:2px 0;color:var(--dim);font-size:12px}
#controls{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
#controls label{background:#1d1924cc;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--dim)}
#controls select{background:#2a2433;color:var(--text);border:1px solid var(--line);border-radius:4px;font:inherit;max-width:240px}
#grid{position:absolute;inset:0;overflow:auto;padding:12px;display:none}
#grid h3{font-size:12px;color:var(--dim);margin:14px 0 6px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:11px;color:var(--dim);overflow:hidden;cursor:pointer}
.tile img{width:64px;height:64px;image-rendering:pixelated;object-fit:contain;display:block;margin:0 auto 4px;background:repeating-conic-gradient(#221d29 0 25%,#1a1620 0 50%) 0 0/12px 12px}
.tile span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#big{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:5;cursor:zoom-out}
#big img{max-width:90vw;max-height:80vh;min-width:256px;image-rendering:pixelated;background:repeating-conic-gradient(#221d29 0 25%,#1a1620 0 50%) 0 0/16px 16px}
#big p{color:var(--text);text-align:center}
iframe{border:0;width:100%;height:100%;display:none;background:#16131c}
#msg{position:absolute;inset:0;display:none;place-items:center;color:var(--dim);text-align:center;padding:30px}
@media (max-width:700px){#side{width:46%;min-width:0}}
</style>

<body>
<header>
  <h1>The Hollow Crown · assets</h1>
  <nav id="tabs"></nav>
  <div id="status">
    <span><span id="dot" class="dot busy"></span> <span id="stext">Starting</span></span>
    <select id="mode" title="What to show">
      <option value="all">Main + work in progress</option>
      <option value="main">Only what is merged</option>
    </select>
    <button id="now" title="Check GitHub for new pushes now">Check now</button>
  </div>
</header>
<main>
  <div id="side">
    <div id="sidetop">
      <input id="q" type="search" placeholder="Search everything  ( / )" autocomplete="off" aria-label="Search">
      <div class="row"><label><input type="checkbox" id="onlynew"> Only new work</label><button id="fold">Collapse all</button></div>
    </div>
    <div id="list"></div>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="info"></div>
    <div id="controls"></div>
    <div id="grid"></div>
    <iframe id="builds" title="Builds"></iframe>
    <div id="msg"></div>
  </div>
</main>
<div id="big"><div><img id="bigimg" alt=""><p id="bigp"></p></div></div>
<script type="module">

// Bedrock geometry -> three.js, in Blockbench's space (x mirrored), 16 units = 1 block.
const D2R = Math.PI / 180;

// ------------------------------------------------------------ data and live updates
const branchInfo = (ref) => {

  const b = state?.branches.find((x) => x.ref === ref);

$("mode").onchange = () => fetch("/api/mode?m=" + $("mode").value, { method: "POST" });

$("q").onkeydown = (e) => {

addEventListener("keydown", (e) => {

let onlyNew = localStorageGet("onlynew") === "1";
$("onlynew").checked = onlyNew;
$("onlynew").onchange = () => { onlyNew = $("onlynew").checked; localStorageSet("onlynew", onlyNew ? "1" : "0"); render(false); };

$("big").onclick = () => { $("big").style.display = "none"; };

// ------------------------------------------------------------ tabs

  for (const t of ["items", "textures"]) n[t] = gridItems(t).filter((x) => (!onlyNew || isNewRef(x.ref)) && hit(x.name + " " + x.folder)).length;

}

  canvas.style.display = $("info").style.display = $("controls").style.display = isBuilds || isGrid ? "none" : "";
  $("msg").style.display = "none";
  if (isBuilds) { if ($("builds").dataset.loaded !== "1") openBuilds(); paintList(); return; }
  if (!data) { $("list").innerHTML = ""; $("msg").style.display = "grid"; $("msg").textContent = "Reading the packs from git"; return; }
  if (isGrid) return paintGrid();
  if (!selected[tab]) selected[tab] = localStorageGet("sel." + tab) || treeItems(tab)[0]?.key;
  revealSelected();
  paintList();
  draw(fresh);         // a live refresh keeps the camera where it is
  resize();
}

function entries(t = tab) {
  if (t === "mobs") return data.entities.map((e) => ({ key: e.id, title: e.name, group: e.group, sub: e.id, e }));
  if (t === "blocks") return data.blocks.map((b) => ({ key: b.id, title: b.name, group: b.group || "blocks", sub: b.id, b }));
  if (t === "armour") {
    const sets = new Map();
    for (const a of data.attachables) { const s = sets.get(a.set) || { key: a.set, title: a.slot ? a.setName : a.name, group: a.group || (a.slot ? "armour" : "held and worn items"), parts: [] }; s.parts.push(a); sets.set(a.set, s); }
    return [...sets.values()].map((s) => ({ ...s, sub: s.parts.map((p) => p.slot || "worn").join(", ") }));
  }
  return [];
}

// ------------------------------------------------------------ the side list
// One list for every tab: sections that fold, sub-groups inside, and builds that come in several looks (styles,
// regions, roofs) folded into one row with a chip per look. Search matches every word, in any field.
const isNewRef = (ref) => !!ref && ref !== "origin/main" && ref !== "main" && ref !== "vanilla";
function treeItems(t) {
  if (t === "builds") return (builds || []).map((b) => ({ key: b.key, title: b.title, section: b.section, group: b.group || "", sub: b.sub || "", isNew: !!b.fresh, from: b.from }));
  if (!data) return [];
  const rows = entries(t).map((x) => {
    const ref = x.e?.ref || x.b?.ref || x.parts?.[0]?.ref;
    return { key: x.key, title: x.title, section: x.group, group: "", sub: x.sub || "", isNew: isNewRef(ref) };
  });
  return rows.sort((a, b) => a.section.localeCompare(b.section) || a.title.localeCompare(b.title));
}
const words = () => query.split(/\s+/).filter(Boolean);
const hit = (text) => { const h = text.toLowerCase(); return words().every((w) => h.includes(w)); };
const wanted = (i) => (!onlyNew || i.isNew) && hit(`${i.title} ${i.sub} ${i.section} ${i.group} ${i.key}`);
const mark = (text) => {   // the search words, highlighted
  const t = String(text), low = t.toLowerCase(), on = new Uint8Array(t.length);
  for (const w of words()) for (let i = low.indexOf(w); i >= 0; i = low.indexOf(w, i + 1)) on.fill(1, i, i + w.length);
  let h = "", run = "";
  for (let i = 0; i <= t.length; i++) {
    if (i === t.length || (i > 0 && on[i] !== on[i - 1])) { h += on[i - 1] ? `<mark>${esc(run)}</mark>` : esc(run); run = ""; }
    if (i < t.length) run += t[i];
  }
  return h;
};
const open = {}, lastLook = {};
for (const t of ["builds", "mobs", "armour", "blocks"]) { try { open[t] = new Set(JSON.parse(localStorageGet("open." + t) || "[]")); } catch { open[t] = new Set(); } }
const saveOpen = () => localStorageSet("open." + tab, JSON.stringify([...open[tab]]));
function revealSelected() {
  const i = treeItems(tab).find((x) => x.key === selected[tab]);
  if (i && !open[tab].has(i.section)) { open[tab].add(i.section); saveOpen(); }
}
function scrollToSelected() { $("list").querySelector(".it.on")?.scrollIntoView({ block: "nearest" }); }
// a look's short name: "Ashford, gable roof" in the Ashford section reads "gable roof"
const lookName = (v, section) => (v.sub.startsWith(section + ", ") ? v.sub.slice(section.length + 2) : v.sub) || v.key;

function paintList() {
  const items = treeItems(tab), shown = items.filter(wanted), filtering = words().length > 0 || onlyNew;
  const secs = new Map();
  for (const i of shown) {
    if (!secs.has(i.section)) secs.set(i.section, { total: 0, fresh: 0, groups: new Map() });
    const s = secs.get(i.section); s.total++; if (i.isNew) s.fresh++;
    if (!s.groups.has(i.group)) s.groups.set(i.group, new Map());
    const rows = s.groups.get(i.group);
    if (!rows.has(i.title)) rows.set(i.title, []);
    rows.get(i.title).push(i);
  }
  let html = "";
  for (const [name, s] of secs) {
    const isOpen = filtering || open[tab].has(name);
    html += `<div class="sec${isOpen ? " open" : ""}"><button class="sh" data-s="${esc(name)}" aria-expanded="${isOpen}"><span class="car">▸</span><span>${mark(name)}</span>${s.fresh ? `<small class="wip">${s.fresh} new</small>` : ""}<span class="n">${s.total}</span></button>`;
    if (isOpen) for (const [g, rows] of s.groups) {
      if (g) html += `<h4>${mark(g)}</h4>`;
      for (const [title, vs] of rows) {
        const on = vs.some((v) => v.key === selected[tab]);
        const names = vs.map((v) => lookName(v, name)), dup = names.map((n, k) => names.indexOf(n) !== k || names.lastIndexOf(n) !== k);
        const counter = {};
        const label = names.map((n, k) => dup[k] ? `${n} ${(counter[n] = (counter[n] || 0) + 1)}` : n);
        const one = vs.length === 1 ? (vs[0].sub && vs[0].sub !== name ? `<small>${mark(lookName(vs[0], name))}</small>` : "") : `<small>${vs.length} looks</small>`;
        html += `<div class="it${on ? " on" : ""}" data-keys="${esc(vs.map((v) => v.key).join("\n"))}" data-looks="${esc(label.join("\n"))}"><span>${mark(title)}${vs.some((v) => v.isNew) ? ` <small class="wip" title="${esc("Changed on " + (vs.find((v) => v.isNew).from || "a branch"))}">new</small>` : ""}</span>${tab === "builds" ? one : ""}</div>`;
        if (vs.length > 1 && (on || filtering)) html += `<div class="chips">${vs.map((v, k) => `<button data-k="${esc(v.key)}" class="${v.key === selected[tab] ? "on" : ""}${v.isNew ? " wip" : ""}">${mark(label[k])}</button>`).join("")}</div>`;
      }
    }
    html += "</div>";
  }
  $("list").innerHTML = html || `<p class="none">${tab === "builds" && !builds ? "Building the catalogue…" : `Nothing here${filtering ? " matches" : " yet"}.`}</p>`;
  for (const el of $("list").querySelectorAll(".sh")) el.onclick = () => {
    if (filtering) return;
    const n = el.dataset.s; open[tab].has(n) ? open[tab].delete(n) : open[tab].add(n); saveOpen(); paintList();
  };
  for (const el of $("list").querySelectorAll(".it")) el.onclick = () => {
    const keys = el.dataset.keys.split("\n"), looks = el.dataset.looks.split("\n");
    // keep the look you were on: picking another map building after "Norman stone" opens its Norman stone one
    const k = keys.includes(selected[tab]) ? selected[tab] : keys[looks.indexOf(lastLook[tab])] || keys[0];
    pick(k, looks[keys.indexOf(k)]);
  };
  for (const el of $("list").querySelectorAll(".chips button")) el.onclick = () => pick(el.dataset.k, el.textContent);
}
function pick(key, look) {
  selected[tab] = key; localStorageSet("sel." + tab, key);
  if (look) lastLook[tab] = look;
  paintList();
  if (tab === "builds") goBuild(key); else draw(false);
}

const choice = {};
function control(label, key, options, onchange) {
  if (options.length < 2) return "";
  if (!options.some((o) => o.v === choice[key])) choice[key] = options[0].v;
  return `<label>${label} <select data-c="${key}">${options.map((o) => `<option value="${esc(o.v)}"${o.v === choice[key] ? " selected" : ""}>${esc(o.t)}</option>`).join("")}</select></label>`;
}
function wireControls() { for (const s of $("controls").querySelectorAll("select")) s.onchange = () => { choice[s.dataset.c] = s.value; draw(true); }; }
const geoOf = (id) => data.geometry[id];

function draw(keepView) {
  const x = entries().find((e) => e.key === selected[tab]);
  if (!x) { $("info").innerHTML = ""; $("controls").innerHTML = ""; if (model) scene.remove(model); return; }
  const notes = [];
  if (x.e) {
    const e = x.e, k = "m:" + e.id;
    $("controls").innerHTML = control("Look", k + ":t", e.textures.map((t) => ({ v: t.key, t: t.key + (t.url ? "" : " (vanilla, not shown)") })))
      + control("Shape", k + ":g", e.geometry.map((g) => ({ v: g.key, t: g.key + " · " + g.id })));
    wireControls();
    const t = e.textures.find((t) => t.key === choice[k + ":t"]) || e.textures[0];
    const g = e.geometry.find((g) => g.key === choice[k + ":g"]) || e.geometry[0];
    const geo = g && geoOf(g.id);
    if (!geo) notes.push(g ? `Shape ${g.id} not found` : "No shape");
    if (t && !t.url) notes.push(`Texture ${t.path} is vanilla Minecraft, shown grey`);
    show(geo ? buildGeo(geo, matFor(t?.url)) : new THREE.Group(), keepView);
    $("info").innerHTML = `<h2>${esc(e.name)}</h2><p>${esc(e.id)} · ${branchInfo(e.ref)}</p>${g ? `<p>${esc(g.id)}${geo ? " · from " + (geo.from === "vanilla" ? "vanilla" : branchInfo(geo.from)) : ""}</p>` : ""}${notes.map((n) => `<p>${esc(n)}</p>`).join("")}`;
  } else if (x.parts) {
    const k = "a:" + x.key;
    // Held items (swords, tools) are bound to the hand bone in game and posed by animations; drawn on the
    // mannequin without those they land at its feet, so they are shown on their own, upright.
    const held = x.parts.every((p) => !p.slot || (geoOf(p.geometry[0]?.id)?.bones || []).some((b) => b.binding));
    $("controls").innerHTML = held ? "" : control("Body", k + ":body", [{ v: "on", t: "Mannequin" }, { v: "off", t: "Armour only" }]);
    wireControls();
    const root = new THREE.Group();
    const body = geoOf("geometry.humanoid.custom");
    if (body && !held && choice[k + ":body"] !== "off") root.add(buildGeo(body, mannequin, (n) => !/hat|jacket|sleeve|pants|cape|elytra/i.test(n)));
    const lines = [];
    for (const p of x.parts) {
      const t = p.textures.find((t) => t.key === "enchanted" ? false : true) || p.textures[0];
      const g = p.geometry[0], geo = g && geoOf(g.id);
      if (!geo) { notes.push(`${p.name}: shape ${g?.id || "?"} not found`); continue; }
      if (t && !t.url) notes.push(`${p.name}: texture ${t.path} not found`);
      root.add(buildGeo(geo, matFor(t?.url), armourFilter(g.id, p.slot)));
      lines.push(`${esc(p.name)} · ${esc(g.id)} · ${branchInfo(p.ref)}`);
    }
    show(root, keepView);
    $("info").innerHTML = `<h2>${esc(x.title)}</h2>${lines.map((l) => `<p>${l}</p>`).join("")}${notes.map((n) => `<p>${esc(n)}</p>`).join("")}`;
  } else if (x.b) {
    const b = x.b, faces = b.faces, star = faces["*"] || Object.values(faces)[0];
    let obj;
    const geo = b.geometry && geoOf(b.geometry);
    if (geo) {
      const mats = {};
      const matOf = (name) => mats[name] ??= matFor((faces[name] || star)?.url);
      // bone_visibility, worked out for the block's default states (q.block_state('x') -> its first value)
      const vis = b.boneVisibility || {};
      const shows = (bone) => {
        const ex = vis[bone]; if (ex === undefined || ex === true) return true; if (ex === false) return false;
        try {
          const js = String(ex).replace(/q(?:uery)?\.block_state\(\s*'([^']+)'\s*\)/g, (_, k) => JSON.stringify(b.states?.[k] ?? 0));
          return !!Function(`"use strict"; return (${js});`)();
        } catch { return true; }
      };
      obj = buildGeo(geo, matOf, shows);
    }
    else {
      const m = (f) => matFor((faces[f] || star)?.url);
      // three's box face order: +x, -x, +y, -y, +z, -z
      obj = new THREE.Mesh(new THREE.BoxGeometry(16, 16, 16), [m("east"), m("west"), m("up"), m("down"), m("south"), m("north")]);
      obj.position.y = 8;
      if (b.geometry) notes.push(`Shape ${b.geometry} not found, drawn as a cube`);
    }
    show(obj, keepView);
    const missing = Object.values(faces).filter((f) => !f.url).map((f) => f.name);
    if (missing.length) notes.push("Missing textures: " + missing.join(", "));
    $("info").innerHTML = `<h2>${esc(b.name)}</h2><p>${esc(b.id)} · ${branchInfo(b.ref)}</p>${notes.map((n) => `<p>${esc(n)}</p>`).join("")}`;
    $("controls").innerHTML = "";
  }
}

function gridItems(t) {
  return t === "items" ? data.items.map((i) => ({ name: i.name, url: i.url, ref: i.ref, folder: "item icons", path: i.missing })) :
    data.textures.map((t) => ({ name: t.path.split("/").pop().replace(/\.(png|tga)$/i, ""), url: t.url, ref: t.ref, folder: t.path.split("/").slice(0, -1).join("/"), path: t.path }));
}
function paintGrid() {
  const shown = gridItems(tab).filter((x) => (!onlyNew || isNewRef(x.ref)) && hit(x.name + " " + x.folder));
  const folders = new Map();
  for (const x of shown) { if (!folders.has(x.folder)) folders.set(x.folder, []); folders.get(x.folder).push(x); }
  let html = `<input id="gq" placeholder="Search" value="${esc(query)}" style="padding:6px 8px;background:#120f17;border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;width:260px">`;
  for (const [f, xs] of [...folders].sort((a, b) => a[0].localeCompare(b[0]))) {
    html += `<h3>${esc(f)} · ${xs.length}</h3><div class="tiles">` + xs.map((x) =>
      `<div class="tile" data-u="${esc(x.url || "")}" data-n="${esc(x.name)}" data-r="${esc(x.ref || "")}">${x.url ? `<img loading="lazy" src="${esc(x.url)}?v=${data.version}" alt="">` : "<img alt=''>"}<span class="${x.ref && x.ref !== "origin/main" ? "wip" : ""}">${esc(x.name)}</span></div>`).join("") + "</div>";
  }
  $("grid").innerHTML = html;
  const gq = $("gq"); gq.oninput = () => { query = gq.value.toLowerCase(); $("q").value = gq.value; paintTabs(); paintGrid(); const n = $("gq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  for (const t of $("grid").querySelectorAll(".tile")) t.onclick = () => {
    if (!t.dataset.u) return;
    $("bigimg").src = t.dataset.u + "?v=" + data.version; $("bigp").innerHTML = esc(t.dataset.n) + " · " + branchInfo(t.dataset.r); $("big").style.display = "grid";
  };
}

for (const k of ["builds", "mobs", "armour", "blocks"]) selected[k] = localStorageGet("sel." + k);
render(false);
</script>
</body>
</html>
